{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">WORKFORCE</p><h1>Repair workers</h1></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#workerModal">Add worker</button></div><section class="panel"><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Contact</th><th>Specialization</th><th>Availability</th><th>Active workload</th></tr></thead><tbody id="workerRows"></tbody></table></div></section><div class="modal fade" id="workerModal"><div class="modal-dialog"><form id="workerForm" class="modal-content"><div class="modal-header"><h2 class="modal-title">Add repair worker</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label>Name<input name="name" class="form-control" required></label><label>Email<input name="email" class="form-control" type="email" required></label><label>Phone<input name="phone" class="form-control"></label><label>Specialization<input name="specialization" class="form-control"></label><label>Temporary password<input name="password" class="form-control" type="password" minlength="8" required></label></div><div class="modal-footer"><button class="btn btn-primary">Create worker</button></div></form></div></div>{% endblock %}{% block scripts %}<script src="{{ url_for('static',filename='js/admin.js') }}"></script>{% endblock %}
