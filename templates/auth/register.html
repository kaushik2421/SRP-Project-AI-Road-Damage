{% extends 'base.html' %}{% block public %}<main class="auth-page"><form method="post" class="auth-card"><a class="brand" href="/">ROAD<span>WATCH</span></a><h1>Create an account</h1><p>Citizen accounts can report and track road damage.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<label>Full name<input class="form-control" name="full_name" required></label><label>Email<input class="form-control" name="email" type="email" required></label><label>Phone<input class="form-control" name="phone" inputmode="tel"></label><label>Password<input class="form-control" name="password" type="password" minlength="8" required></label><button class="btn btn-primary w-100">Create account</button><p class="mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>.</p></form></main>{% endblock %}
