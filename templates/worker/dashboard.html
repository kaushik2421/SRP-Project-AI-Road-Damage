{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">FIELD WORK</p><h1>My assigned repairs</h1><p>Document progress and submit repair completion.</p></div></div><section id="metrics" class="metrics"></section><div id="workerJobs" class="job-grid"></div><div class="modal fade" id="repairModal"><div class="modal-dialog"><form id="repairForm" class="modal-content" enctype="multipart/form-data"><div class="modal-header"><h2 class="modal-title">Repair update</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="repairComplaintId" type="hidden"><label>Status<select class="form-select" name="status"><option>IN_PROGRESS</option><option>REPAIR_COMPLETED</option></select></label><label>Notes<textarea name="notes" class="form-control"></textarea></label><label>Before image<input name="before_image" type="file" accept="image/*" class="form-control"></label><label>After image<input name="after_image" type="file" accept="image/*" class="form-control"></label></div><div class="modal-footer"><button class="btn btn-primary">Save update</button></div></form></div></div>{% endblock %}{% block scripts %}<script src="{{ url_for('static',filename='js/dashboard.js') }}"></script>{% endblock %}
